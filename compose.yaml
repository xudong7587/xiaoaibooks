services:
  app:
    image: ghcr.io/xudong7587/xiaoaibooks:0.2.9
    container_name: xiaoaibooks
    ports:
      - "18765:18765" # 左侧为 NAS 端口
    volumes:
      - "./data:/data" # 左侧为你的数据目录
    environment:
      P0_ADMIN_TOKEN: "" # 必填：设置至少 8 位的管理员令牌
    restart: unless-stopped
    stop_grace_period: 90s
